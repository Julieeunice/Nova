<script>
    let tipoProfiloAttivo = '';
    let testoBenvenutoIniziale = '';

    // Funzione per mostrare la chat del profilo cliccato
    function apriSezione(tipo, titolo, benvenuto) {
        tipoProfiloAttivo = tipo;
        testoBenvenutoIniziale = benvenuto;

        // Scambio schermate pulito controllato da JS
        document.getElementById('schermata-home').style.display = 'none';
        document.getElementById('schermata-chat').style.display = 'block';

        // Imposta i testi corretti
        document.getElementById('titolo-corrente').innerText = titolo;
        document.getElementById('box-testo-risposta').innerText = benvenuto;
        document.getElementById('ins-testo-utente').value = '';
    }

    // Funzione per tornare indietro alla lista
    function chiudiSezione() {
        document.getElementById('schermata-chat').style.display = 'none';
        document.getElementById('schermata-home').style.display = 'grid';
    }

    // Gestore risposte IA della chat
    function inviaMessaggioIa() {
        const inputField = document.getElementById('ins-testo-utente');
        const boxRisposta = document.getElementById('box-testo-risposta');

        const testo = inputField.value.trim();
        if (testo === '') return;

        const testoMinuscolo = testo.toLowerCase();
        let rispostaGenerata = "✨ Ho preso nota della tua richiesta per questo profilo. Dimmi pure come desideri procedere per approfondire!";

        // Risposte immediate basate sull'identità scelta
        if (tipoProfiloAttivo === 'casalinga') {
            rispostaGenerata = "🏠 Ottima domanda! Per la gestione della casa, ti consiglio di iniziare organizzando una lista della spesa settimanale e un piano dei pasti. Vuoi che ti aiuti a crearne uno insieme, con budget e ricette suggerite?";
        } else if (tipoProfiloAttivo === 'studente') {
            rispostaGenerata = "🎓 Capito! Per studiare in modo efficace, ti consiglio la tecnica del ripasso attivo: rileggi gli appunti, poi prova a spiegarli a voce alta senza guardarli. Vuoi che ti prepari uno schema di ripasso su questo argomento?";
        } else if (tipoProfiloAttivo === 'dottore') {
            rispostaGenerata = "🩺 Ricevuto. Per l'organizzazione clinica, posso aiutarti a strutturare l'agenda visite, preparare promemoria per i pazienti o riassumere informazioni cliniche generali. Su cosa vuoi concentrarti?";
        } else if (tipoProfiloAttivo === 'astronomo') {
            rispostaGenerata = "🚀 Sistema di calcolo cosmico attivo. Posso aiutarti con distanze stellari, coordinate di osservazione o spiegazioni su fenomeni astronomici. Dimmi quale corpo celeste o calcolo ti interessa.";
        } else if (tipoProfiloAttivo === 'ricercatore') {
            rispostaGenerata = "🔬 Perfetto, sono pronta ad aiutarti nei laboratori Nova. Posso assisterti con formati di citazione, organizzazione di dati statistici o struttura di una bozza di paper. Da dove vuoi partire?";
        } else if (tipoProfiloAttivo === 'ingegnere') {
            rispostaGenerata = "💻 Console di sviluppo attiva. Posso aiutarti con setup di codice, comandi terminali o risoluzione di bug. Descrivimi il problema o l'ambiente su cui stai lavorando.";
        } else if (tipoProfiloAttivo === 'chef') {
            rispostaGenerata = "👨‍🍳 Chef, ai tuoi ordini! Posso suggerirti combinazioni di sapori, ricette su misura o tabelle di cottura precise. Dimmi che ingredienti hai a disposizione o cosa vuoi preparare.";
        } else if (tipoProfiloAttivo === 'artista') {
            rispostaGenerata = "🎨 Spazio creativo attivo. Posso proporti palette di colori, idee di design o esercizi grafici per allenare la creatività. Che tipo di progetto hai in mente?";
        } else if (tipoProfiloAttivo === 'avvocato') {
            rispostaGenerata = "⚖️ Modulo legale pronto. Posso aiutarti a strutturare bozze di documenti, riassumere riferimenti normativi generali o organizzare scadenze. Su quale ambito vuoi lavorare?";
        } else if (tipoProfiloAttivo === 'insegnante') {
            rispostaGenerata = "📚 Aula virtuale pronta. Posso aiutarti a preparare piani di lezione, esercizi per gli studenti o metodi di verifica dell'apprendimento. Che materia o argomento stai trattando?";
        }

        boxRisposta.innerText = rispostaGenerata;
        inputField.value = '';
    }

    // Permette di inviare il messaggio anche premendo Invio
    document.addEventListener('DOMContentLoaded', function () {
        const campo = document.getElementById('ins-testo-utente');
        if (campo) {
            campo.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    inviaMessaggioIa();
                }
            });
        }
    });
</script>
</body>
</html>
