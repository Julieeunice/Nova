<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #111827;
            --card-border: #1f2937;
            --card-hover: #1f2937;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* --- SCHERMATA SELEZIONE PROFILI --- */
        #selection-screen {
            width: 100%;
            max-width: 640px;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 12px 0;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .profile-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .profile-btn:hover {
            background-color: var(--card-hover);
            border-color: #374151;
        }

        .profile-btn.active {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 0 1px var(--accent-green);
        }

        .profile-btn .icon {
            font-size: 2rem;
        }

        .profile-btn .label {
            font-size: 1rem;
            font-weight: 500;
        }

        .search-container {
            width: 100%;
            margin-top: 16px;
        }

        .search-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .search-btn .icon {
            font-size: 1.5rem;
        }

        .search-btn .text {
            color: #3b82f6;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* --- SCHERMATA CHAT --- */
        #chat-screen {
            display: none; /* Nascosta all'inizio */
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }

        .chat-header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .back-btn:hover {
            color: var(--text-main);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.user {
            background-color: var(--accent-blue);
            color: #ffffff;
            align-self: flex-end;
        }

        .message.nova {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            align-self: flex-start;
        }

        .chat-input-container {
            border-top: 1px solid var(--card-border);
            padding: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 6px 12px;
            align-items: center;
        }

        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-wrapper button {
            background: transparent;
            border: none;
            color: var(--accent-blue);
            font-size: 1.25rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Schermata Principale di Selezione -->
    <div id="selection-screen">
        <header>
            <h1>★ Nova</h1>
            <p>Scegli il tuo profilo o cerca quello perfetto per te</p>
        </header>

        <main class="grid-container">
            <div class="profile-btn" onclick="selectProfile(this, 'Casalinga', '🏠')">
                <span class="icon">🏠</span>
                <span class="label">Casalinga</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Studente', '🎓')">
                <span class="icon">🎓</span>
                <span class="label">Studente</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Dottore', '🩺')">
                <span class="icon">🩺</span>
                <span class="label">Dottore</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Astronomo', '🚀')">
                <span class="icon">🚀</span>
                <span class="label">Astronomo</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Ricercatore', '🔬')">
                <span class="icon">🔬</span>
                <span class="label">Ricercatore</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Ingegnere & Dev', '💻')">
                <span class="icon">💻</span>
                <span class="label">Ingegnere & Dev</span>
            </div>
            <div class="profile-btn active" onclick="selectProfile(this, 'Chef & Cucina', '🧑‍🍳')">
                <span class="icon">🧑‍🍳</span>
                <span class="label">Chef & Cucina</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Artista & Creativo', '🎨')">
                <span class="icon">🎨</span>
                <span class="label">Artista & Creativo</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Avvocato', '⚖️')">
                <span class="icon">⚖️</span>
                <span class="label">Avvocato</span>
            </div>
            <div class="profile-btn" onclick="selectProfile(this, 'Insegnante', '🍎')">
                <span class="icon">🍎</span>
                <span class="label">Insegnante</span>
            </div>
        </main>

        <div class="search-container">
            <div class="search-btn" onclick="openSearchModal()">
                <span class="icon">🔍</span>
                <span class="text">Non trovi il tuo profilo? Cerca Altro...</span>
            </div>
        </div>
    </div>

    <!-- Schermata Chat (Inizialmente nascosta) -->
    <div id="chat-screen">
        <div class="chat-header">
            <button class="back-btn" onclick="showSelectionScreen()">← I tuoi profili</button>
            <h2 id="active-profile-title">★ Nova</h2>
            <div style="width: 80px;"></div> <!-- Bilanciatore visivo space-between -->
        </div>

        <div class="chat-messages" id="chat-box">
            <!-- I messaggi compariranno qui dentro -->
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="user-input" placeholder="Scrivi un messaggio a Nova..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        let currentProfile = "Chef & Cucina";
        let currentIcon = "🧑‍🍳";

        function selectProfile(element, profileName, icon) {
            document.querySelectorAll('.profile-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            currentProfile = profileName;
            currentIcon = icon;

            // Avvia la transizione verso la chat dopo un breve ritardo per feedback visivo
            setTimeout(() => {
                showChatScreen();
            }, 300);
        }
