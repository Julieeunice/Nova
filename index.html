<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - L'Assistente Universale</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #2ea44f;
            --search-accent: #238636;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 650px;
        }

        header h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Schermata Selezione Profili */
        .grid-profili {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 400px) {
            .grid-profili {
                grid-template-columns: 1fr;
            }
        }

        .grid-profili button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 15px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .grid-profili button:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Bottone Speciale per Cercare Altro */
        .grid-profili button.btn-special-search {
            grid-column: span 2;
            background-color: #21262d;
            border: 1px dashed var(--search-accent);
            color: #58a6ff;
        }
        @media (max-width: 400px) {
            .grid-profili button.btn-special-search {
                grid-column: span 1;
            }
        }
        .grid-profili button.btn-special-search:hover {
            border-color: #58a6ff;
            background-color: #282e38;
        }

        .icona {
            font-size: 1.8rem;
        }

        /* Schermata Dashboard Profilo */
        .dashboard {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
        }

        .btn-indietro {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-indietro:hover {
            color: white;
        }

        .titolo-profilo {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Box di Input per la ricerca dinamica */
        .search-box-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .search-submit-btn {
            background-color: var(--search-accent);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-submit-btn:hover {
            background-color: var(--accent-color);
        }

        /* Griglia dei Bottoni Funzionali */
        .area-comandi {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-azione {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-azione:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* Area di Output dei Risultati */
        .output-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <header>
        <h1>★ Nova</h1>
        <p>Scegli il tuo profilo o cerca quello perfetto per te</p>
    </header>

    <div class="container">
        
        <!-- SCHERMATA 1: SELEZIONE PROFILI -->
        <div id="schermata-selezione" class="grid-profili">

            <button onclick="apriProfilo('dottore', '🩺 Dottore')">

            </button>
            <button onclick="apriProfilo('astronomo', '🚀 Astronomo')">

            <button onclick="apriProfilo('ricercatore', '🔬 Ricercatore')">
                <span class="icona">🔬</span> Ricercatore
            </button>
            <button onclick="apriProfilo('ingegnere', '💻 Ingegnere & Dev')">

            <button onclick="apriProfilo('chef', '👨‍🍳 Chef & Cucina')">

            <button onclick="apriProfilo('artista', '🎨 Artista & Creativo')">
                <span class="icona">🎨</span> Artista & Creativo
            </button>
            <button onclick="apriProfilo('avvocato', '⚖️ Avvocato')">
                <span class="icona">⚖️</span> Avvocato
            </button>
            <button onclick="apriProfilo('insegnante', '🍎 Insegnante')">
                <span class="icona">🍎</span> Insegnante
            </button>
            
            <!-- NUOVO BOTTONE: APRENDO QUESTO TROVERANNO CIÒ CHE CERCANO -->
            <button class="btn-special-search" onclick="apriInterfacciaRicerca()">
                <span class="icona">🔍</span> Non trovi il tuo profilo? Cerca Altro...
            </button>
        </div>

        <!-- SCHERMATA 2: DASHBOARD DINAMICA -->
        <div id="schermata-dashboard" class="dashboard">
            <button class="btn-indietro" onclick="tornaAllaHome()">← Torna alla Home</button>
            <h2 id="titolo-profilo-attivo" class="titolo-profilo">Profilo</h2>
            
            <!-- Box di ricerca visibile solo nella modalità di ricerca personalizzata -->
            <div id="area-ricerca-personalizzata" class="search-box-container" style="display: none;">
                <input type="text" id="input-lavoro-personalizzato" class="search-input" placeholder="Es. Meccanico, Fotografo, Scrittore, Sportivo...">
                <button class="search-submit-btn" onclick="generaProfiloSuMisura()">Crea Strumenti</button>
            </div>
            
            <!-- Contenitore dinamico dei bottoni del profilo -->
            <div id="contenitore-bottoni" class="area-comandi"></div>
            
            <!-- Box dove appaiono i risultati dei bottoni -->
            <div id="box-risultato" class="output-box"></div>
        </div>

    </div>
