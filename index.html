<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - Il tuo Assistente Personale</title>
    <style>
        /* RESET E STILE GENERALE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* HEADER */
        header {
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: none;
        }

        .settings-btn {
            position: absolute;
            right: 0;
            top: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn svg {
            width: 22px;
            height: 22px;
            fill: #8a8f98;
            transition: fill 0.2s;
        }

        .settings-btn:hover svg { fill: #fff; }

        .brand-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-icon-svg {
            width: 32px;
            height: 32px;
            fill: #ff9f43;
            filter: drop-shadow(0 0 8px rgba(255, 159, 67, 0.4));
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .tagline {
            font-size: 14px;
            color: #8a8f98;
        }

        /* VISTE SCHERMATE */
        .view {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .hidden { display: none !important; }

        /* GRIGLIA HOME */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .profile-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .profile-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-icon svg { width: 24px; height: 24px; }
        .profile-title { font-size: 16px; font-weight: 600; color: #ffffff; }

        /* COLORI PROFILI */
        .p-biz { border-color: rgba(255, 159, 67, 0.2); } .p-biz .profile-icon { background: rgba(255, 159, 67, 0.1); fill: #ff9f43; } .p-biz:hover { border-color: #ff9f43; }
        .p-student { border-color: rgba(52, 152, 219, 0.2); } .p-student .profile-icon { background: rgba(52, 152, 219, 0.1); fill: #3498db; } .p-student:hover { border-color: #3498db; }
        .p-home { border-color: rgba(46, 204, 113, 0.2); } .p-home .profile-icon { background: rgba(46, 204, 113, 0.1); fill: #2ecc71; } .p-home:hover { border-color: #2ecc71; }
        .p-mom { border-color: rgba(233, 30, 99, 0.2); } .p-mom .profile-icon { background: rgba(233, 30, 99, 0.1); fill: #e91e63; } .p-mom:hover { border-color: #e91e63; }
        .p-health { border-color: rgba(155, 89, 182, 0.2); } .p-health .profile-icon { background: rgba(155, 89, 182, 0.1); fill: #9b59b6; } .p-health:hover { border-color: #9b59b6; }
        .p-general { border-color: rgba(26, 188, 156, 0.2); } .p-general .profile-icon { background: rgba(26, 188, 156, 0.1); fill: #1abc9c; } .p-general:hover { border-color: #1abc9c; }

        /* STRUMENTI INTERNI */
        .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #8a8f98; margin-bottom: 16px; }
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .tool-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; cursor: pointer; transition: all 0.2s; text-align: left; }
        .tool-card:hover { background: rgba(255, 255, 255, 0.06); transform: translateY(-2px); }
        .tool-icon-box { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .tool-icon-box svg { width: 20px; height: 20px; }
        .tool-text { font-size: 15px; font-weight: 500; color: #e5e7eb; line-height: 1.4; }

        /* AREA CHAT INTERFACCIA */
        .chat-container { display: flex; flex-direction: column; gap: 20px; }
        .chat-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; min-height: 250px; max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .msg-user { background: rgba(255,255,255,0.08); align-self: flex-end; color: #fff; }
        .msg-nova { background: rgba(255, 159, 67, 0.1); border: 1px solid rgba(255, 159, 67, 0.15); align-self: flex-start; color: #f3f4f6; }
        
        .input-wrapper { display: flex; gap: 10px; width: 100%; }
        .chat-input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 15px; outline: none; }
        .chat-input:focus { border-color: rgba(255, 159, 67, 0.5); }
        .send-btn { background: #ff9f43; border: none; color: #0d0e12; padding: 0 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: #ffb366; }

        /* SCHERMATA CHIAVE API */
        .api-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        @media (max-width: 500px) { .profile-grid, .tools-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <button class="back-btn" id="backBtn" onclick="goBack()">← Indietro</button>
            <button class="settings-btn" id="settingsBtn" onclick="openSettings()">
                <!-- Icona Ingranaggio SVG (Sicura su tutti i browser) -->
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <div class="brand-wrapper">
                <svg class="brand-icon-svg" viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 11.6l-5.6 4.4L18.4 22 12 17.6 5.6 22l2-6-5.6-4.4 7.6-2.4z"/></svg>
                <h1 class="brand-name">Nova</h1>
            </div>
            <p class="tagline" id="appTagline">Scegli il tuo profilo per iniziare</p>
        </header>

        <!-- VISTA 1: HOME PROFILI -->
        <div id="homeView" class="view">
            <div class="profile-grid">
                <div class="profile-card p-biz" onclick="openCategory('business')">
                    <div class="profile-icon"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg></div>
                    <span class="profile-title">Imprenditore</span>
                </div>
                <div class="profile-card p-student" onclick="openCategory('student')">
                    <div class="profile-icon"><svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg></div>
                    <span class="profile-title">Studente</span>
                </div>
                <div class="profile-card p-home" onclick="openCategory('home')">
                    <div class="profile-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
