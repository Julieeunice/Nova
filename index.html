<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - L'Assistente Universale</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #2ea44f;
            --search-accent: #238636;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --chat-user: #21262d;
            --chat-ai: #1f242c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 700px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Schermata Selezione Profili */
        .grid-profili {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        @media (max-width: 480px) {
            .grid-profili {
                grid-template-columns: 1fr;
            }
        }

        .grid-profili button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .grid-profili button:hover {
            border-color: var(--accent-color);
        }

        .grid-profili button.btn-special-search {
            grid-column: span 2;
            background-color: #21262d;
            border: 1px dashed var(--search-accent);
            color: #58a6ff;
        }
        @media (max-width: 480px) {
            .grid-profili button.btn-special-search {
                grid-column: span 1;
            }
        }

        .icona {
            font-size: 2rem;
        }

        /* Schermata Chat Interattiva */
        .dashboard {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
        }

        .btn-indietro {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-indietro:hover {
            color: white;
        }

        .titolo-profilo {
            font-size: 1.6rem;
            color: white;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        /* Box contenitore dei messaggi di chat */
        .chat-window {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messaggio {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-msg {
            background-color: var(--chat-user);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            background-color: var(--chat-ai);
            color: #e6edf3;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid var(--accent-color);
        }

        /* Barra di input inferiore della chat */
        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .chat-submit-btn {
            background-color: var(--search-accent);
            border: none;
            color: white;
            padding: 0 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-submit-btn:hover {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>★ Nova</h1>
        <p>Scegli un profilo ed entra in chat con l'IA</p>
    </header>

    <div class="container">
        
        <!-- SCHERMATA 1: SELEZIONE PROFILI -->
        <div id="schermata-selezione" class="grid-profili">
            <button onclick="apriChat('casalinga', '🏠 Profilo Casalinga')">
                <span class="icona">🏠</span> Casalinga
            </button>
            <button onclick="apriChat('studente', '🎓 Profilo Studente')">
                <span class="icona">🎓</span> Studente
            </button>
            <button onclick="apriChat('dottore', '🩺 Profilo Dottore')">
                <span class="icona">🩺</span> Dottore
            </button>
            <button onclick="apriChat('astronomo', '🚀 Profilo Astronomo')">
                <span class="icona">🚀</span> Astronomo
            </button>
            <button onclick="apriChat('ricercatore', '🔬 Profilo Ricercatore')">
                <span class="icona">🔬</span> Ricercatore
            </button>
            <button onclick="apriChat('ingegnere', '💻 Profilo Ingegnere & Dev')">
                <span class="icona">💻</span> Ingegnere & Dev
            </button>
            <button onclick="apriChat('chef', '👨‍🍳 Profilo Chef & Cucina')">
                <span class="icona">👨‍🍳</span> Chef & Cucina
            </button>
            <button onclick="apriChat('artista', '🎨 Profilo Artista & Creativo')">
                <span class="icona">🎨</span> Artista & Creativo
            </button>
            <button onclick="apriChat('avvocato', '⚖️ Profilo Avvocato')">
                <span class="icona">⚖️</span> Avvocato
            </button>
            <button onclick="apriChat('insegnante', '🍎 Profilo Insegnante')">
                <span class="icona">🍎</span> Insegnante
            </button>
            
            <button class="btn-special-search" onclick="apriChat('personalizzato', '🔍 Profilo Personalizzato')">
                <span class="icona">🔍</span> Cerca o inventa un altro profilo...
            </button>
        </div>

        <!-- SCHERMATA 2: CHAT CON IA -->
        <div id="schermata-dashboard" class="dashboard">
            <button class="btn-indietro" onclick="tornaAllaHome()">← Esci dalla chat</button>
            <h2 id="titolo-profilo-attivo" class="titolo-profilo">Profilo</h2>
            
            <!-- Finestra di conversazione -->
            <div id="finestra-chat" class="chat-window"></div>
            
            <!-- Barra di invio messaggi -->
            <div class="chat-input-container">
                <input type="text" id="input-messaggio-utente" class="chat-input" placeholder="Scrivi un messaggio alla IA...">
                <button class="chat-submit-btn" onclick="inviaMessaggio()">Invia</button>
            </div>
        </div>

    </div>
