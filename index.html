<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Your AI Assistant</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  :root {
    --bg: #110F0D;
    --bg-elevated: #1A1714;
    --bubble-nova: #1F1B17;
    --accent: #F7941E;
    --accent-glow: rgba(247, 148, 30, 0.18);
    --text-primary: #F5F0EA;
    --text-secondary: #8F8880;
    --border: #2A2622;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-primary); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%), var(--bg-elevated); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sparkle { width: 20px; height: 20px; fill: var(--accent); }
  .header-text h1 { font-size: 16px; font-weight: 600; }
  .header-text p { font-size: 12px; color: var(--text-secondary); }
  .reset-btn { margin-left: auto; background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
  .reset-btn:active { background: var(--bg-elevated); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 18px; padding: 20px 20px 8px; overflow-y: auto; }
  .empty-state .big-avatar { width: 64px; height: 64px; border-radius: 18px; background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%), var(--bg-elevated); display: flex; align-items: center; justify-content: center; margin-top: 8px; }
  .empty-state .big-avatar svg { width: 32px; height: 32px; fill: var(--accent); }
  .empty-state h2 { font-size: 20px; font-weight: 700; }
  .empty-state p { color: var(--text-secondary); font-size: 13.5px; max-width: 300px; line-height: 1.5; }
  .tools-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); width: 100%; text-align: left; margin-top: 6px; }
  .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .tool-card { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); padding: 14px 12px; border-radius: 14px; text-align: left; cursor: pointer; transition: border-color 0.15s; display: flex; flex-direction: column; gap: 6px; }
  .tool-card:active { border-color: var(--accent); }
  .tool-card .tool-icon { font-size: 20px; }
  .tool-card .tool-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
  .suggestion-chip { background: none; border: 1px solid var(--border); color: var(--text-secondary); padding: 9px 14px; border-radius: 10px; font-size: 12.5px; text-align: left; cursor: pointer; }
  .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.nova { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 11px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.error-bubble { border-color: #C0392B !important; }
  .bubble strong { font-weight: 700; }
  .bubble em { font-style: italic; }
  .bubble ul { margin: 6px 0 6px 18px; padding: 0; }
  .bubble li { margin-bottom: 4px; }
  .bubble code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg-wrap.user .bubble { background: var(--accent); color: #1A1108; border-bottom-right-radius: 4px; }
  .msg-wrap.user .bubble code { background: rgba(0,0,0,0.15); }
  .msg-wrap.nova .bubble { background: var(--bubble-nova); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .copy-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-secondary); font-size: 11.5px; cursor: pointer; padding: 4px 6px; margin-top: 2px; border-radius: 6px; }
  .copy-btn:active { background: var(--bg-elevated); }
  .copy-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .copy-btn.copied { color: var(--accent); }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
  #input-bar { display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
  #text-input { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 11px 16px; color: var(--text-primary); font-size: 14.5px; resize: none; max-height: 100px; font-family: inherit; }
  #text-input:focus { outline: none; border-color: var(--accent); }
  #text-input::placeholder { color: var(--text-secondary); }
  #text-input:disabled { opacity: 0.5; }
  #send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; }
  #send-btn:disabled { opacity: 0.4; }
  #send-btn svg { width: 18px; height: 18px; fill: #1A1108; }
  .disclaimer { text-align: center; font-size: 10.5px; color: var(--text-secondary); padding: 6px 0 0; }
  .quota-badge { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 4px 0 0; }
  .quota-badge.low { color: var(--accent); }
  .limit-banner { background: var(--bubble-nova); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin: 0 20px 12px; font-size: 13.5px; line-height: 1.5; text-align: center; display: none; }
  .limit-banner.show { display: block; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

function detectLang() {
  const supported = Object.keys(TRANSLATIONS);
  const browserLangs = navigator.languages || [navigator.language || 'en'];
  for (const bl of browserLangs) {
    const code = bl.slice(0, 2).toLowerCase();
    if (supported.includes(code)) return code;
  }
  return 'en';
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function getQuota() {
  try {
    const raw = localStorage.getItem(QUOTA_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (!data || data.date !== todayKey()) {
      return { date: todayKey(), count: 0 };
    }
    return data;
  } catch (e) {
    return { date: todayKey(), count: 0 };
  }
}

function saveQuota(quota) {
  try {
    localStorage.setItem(QUOTA_KEY, JSON.stringify(quota));
  } catch (e) {}
}

function remainingMessages() {
  const quota = getQuota();
  return Math.max(0, DAILY_LIMIT - quota.count);
}

function incrementQuota() {
  const quota = getQuota();
  quota.count += 1;
  saveQuota(quota);
  updateQuotaUI();
}

function updateQuotaUI() {
  const remaining = remainingMessages();
  const quotaExceeded = remaining <= 0;

  if (quotaExceeded) {
    quotaBadge.textContent = '';
    limitBanner.classList.add('show');
    textInput.placeholder = T.limitPlaceholder;
  } else {
    limitBanner.classList.remove('show');
    textInput.placeholder = T.placeholder;
    quotaBadge.textContent = T.quotaRemaining(remaining);
    quotaBadge.classList.toggle('low', remaining <= 3);
  }

  setInputEnabled(!quotaExceeded && !isSending);
}

function setInputEnabled(enabled) {
  textInput.disabled = !enabled;
  sendBtn.disabled = !enabled;
}

function renderEmptyState() {
  messagesEl.innerHTML = `
    <div class="empty-state">
      <div class="big-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z"/></svg>
      </div>
      <div>
        <h2>${T.greetingTitle}</h2>
        <p>${T.greetingBody}</p>
      </div>
      <div class="tools-label">${T.toolsLabel}</div>
      <div class="tools-grid">
        ${T.tools.map(t => `
          <button class="tool-card" data-text="${t.text.replace(/"/g, '&quot;')}">
            <span class="tool-icon">${t.icon}</span>
            <span class="tool-title">${t.title}</span>
          </button>
        `).join('')}
      </div>
      <div class="tools-label">${T.orLabel}</div>
      <div class="suggestions">
        ${T.suggestions.map(s => `<button class="suggestion-chip" data-text="${s.replace(/"/g, '&quot;')}">${s}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.tool-card, .suggestion-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      if (remainingMessages() <= 0 || isSending) return;
      textInput.value = btn.dataset.text;
      sendMessage();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatMessage(raw) {
  const escaped = escapeHtml(raw);
  const lines = escaped.split('\n');
  let html = '';
  let inList = false;

  for (const line of lines) {
    const trimmed = line.trim();
    const isListItem = /^[-*]\s+/.test(trimmed);

    if (isListItem) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineFormat(trimmed.replace(/^[-*]\s+/, ''))}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (trimmed === '') {
        html += '<br>';
      } else {
        html += inlineFormat(line) + '\n';
      }
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/(?<!\*)\*(?!\*)(.+?)\*(?!\*)/g, '<em>$1</em>');
}

function renderMessages() {
  if (conversation.length === 0) {
    renderEmptyState();
    return;
  }
  messagesEl.innerHTML = conversation.map((m, i) => `
    <div class="msg-wrap ${m.role === 'user' ? 'user' : 'nova'}">
      <div class="bubble ${m.isError ? 'error-bubble' : ''}">${m.role === 'user' ? escapeHtml(m.content) : formatMessage(m.content)}</div>
      ${m.role === 'assistant' && !m.isError ? `
        <button class="copy-btn" data-index="${i}">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>${T.copy}</span>
        </button>
      ` : ''}
    </div>
  `).join('');
  messagesEl.scrollTop = messagesEl.scrollHeight;

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const index = parseInt(btn.dataset.index, 10);
      const text = conversation[index].content;
      try {
        await navigator.clipboard.writeText(text);
        const span = btn.querySelector('span');
        const original = span.textContent;
        span.textContent = T.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          span.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      } catch (e) {
        console.error('Copy failed:', e);
      }
    });
  });
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg-wrap nova';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function saveConversation() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversation));
  } catch (e) {
    console.error('Save error:', e);
  }
}

function loadConversation() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) conversation = JSON.parse(raw);
  } catch (e) {
    conversation = [];
  }
  renderMessages();
}

function errorMessageFor(status) {
  if (status === 429) return T.errorRate;
  if (status === 401 || status === 403) return T.errorAuth;
  if (status >= 500) return T.errorServer;
  return T.errorGeneric;
}

async function sendMessage() {
  if (isSending) return;

  const text = textInput.value.trim();
  if (!text) return;

  if (remainingMessages() <= 0) {
    updateQuotaUI();
    return;
  }

  isSending = true;
  setInputEnabled(false);

  conversation.push({ role: 'user', content: text });
  textInput.value = '';
  textInput.style.height = 'auto';
  renderMessages();
  showTyping();

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.map(({ role, content }) => ({ role, content })) })
    });

    hideTyping();

    let data = {};
    try {
      data = await response.json();
    } catch (e) {
      data = {};
    }

    if (!response.ok) {
      conversation.push({ role: 'assistant', content: errorMessageFor(response.status), isError: true });
    } else {
      const reply = data.reply || T.fallbackReply;
      conversation.push({ role: 'assistant', content: reply });
      incrementQuota();
    }

    renderMessages();
    saveConversation();
  } catch (err) {
    hideTyping();
    conversation.push({ role: 'assistant', content: T.errorConnection, isError: true });
    renderMessages();
    saveConversation();
  } finally {
    isSending = false;
    updateQuotaUI();
    textInput.focus();
  }
}

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

resetBtn.addEventListener('click', () => {
  if (isSending) return;
  conversation = [];
  saveConversation();
  renderMessages();
});

loadConversation();
updateQuotaUI();
</script>

</body>
</html>
