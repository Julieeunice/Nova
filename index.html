<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - L'Assistente Universale</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #2ea44f;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        header h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Schermata Selezione Profili */
        .grid-profili {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-profili button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .grid-profili button:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .icona {
            font-size: 2rem;
        }

        /* Schermata Dashboard Profilo */
        .dashboard {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
        }

        .btn-indietro {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-indietro:hover {
            color: white;
        }

        .titolo-profilo {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Griglia dei Bottoni Funzionali */
        .area-comandi {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-azione {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-azione:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* Area di Output dei Risultati */
        .output-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
        }
    </style>
</head>
